name: Good first issue proposal
description: Suggest a scoped task suitable for a new contributor.
title: "[Good first issue]: "
labels: ["good first issue", "triage"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What should a new contributor change?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Likely files or area
      placeholder: docs/development/onboarding.md, frontend/src/services/...
  - type: textarea
    id: outcome
    attributes:
      label: Smallest acceptable outcome
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Suggested checks
      placeholder: make docs-check, uv run pytest tests/test_name.py
  - type: textarea
    id: context
    attributes:
      label: Helpful context
      description: Link docs, examples, or similar code.
