name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Validate HDP Component manifests
        run: make hdp-components-check
      - name: Run backend tests
        run: uv run pytest

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

  browser-workflows:
    name: Core Browser Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: uv sync --frozen --group dev
      - name: Install browser dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium firefox
      - name: Core workflow and recovery tests
        working-directory: frontend
        run: npm run test:e2e:core
      - name: Browser tests against real backend routes
        working-directory: frontend
        run: npm run test:e2e:backend
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-workflow-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  georeferencer-contract:
    name: Georeferencing Geometry and Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check coordinate transforms and failure boundaries
        run: >-
          uv run --no-project --python 3.11 --with pytest --with numpy
          --with opencv-python-headless --with rasterio --with pyproj
          python -m pytest external_code/georeferencer/test_component.py
          --confcutdir=external_code/georeferencer

  hpc-link:
    name: HPC Link Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hpc-link
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: uv run --with pytest --with pytest-asyncio --with-requirements requirements.lock python -m pytest

  hpc-link-frontend:
    name: HPC Link Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hpc-link/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: hpc-link/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

  docker-compose:
    name: Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: make compose-check

  devcontainer:
    name: Devcontainer Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Read devcontainer configuration
        run: npx --yes @devcontainers/cli read-configuration --workspace-folder . --include-features-configuration
      - name: Build devcontainer image
        run: make devcontainer-check

  developer-onboarding:
    name: Developer Onboarding Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: make setup
      - name: Prepare example env for doctor
        run: cp .env.example .env
      - name: Run onboarding doctor
        run: make doctor
      - name: Validate onboarding checks
        run: make verify-onboarding
