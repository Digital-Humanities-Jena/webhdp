services:
  backend:
    image: ${WEBHDP_BACKEND_IMAGE:-webhdp-backend:${WEBHDP_IMAGE_TAG:-0.1.0-alpha.3}}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/instance/hdp_web.db}
      - FLASK_ENV=production
      - SHARED_SESSION_PATH=/shared/sessions
      - FAST_RENDERER_URL=http://fast-renderer:5002
      - ANY_TO_USDZ_URL=http://any-to-usdz:5003
      - LOCAL_EDM_VALIDATOR_URL=${LOCAL_EDM_VALIDATOR_URL:-http://host.docker.internal:18080}
      - ENABLE_LOCAL_EDM_VALIDATION=${ENABLE_LOCAL_EDM_VALIDATION:-true}
      - LOCAL_EDM_VALIDATOR_REQUIRED=${LOCAL_EDM_VALIDATOR_REQUIRED:-true}
      - LOCAL_EDM_VALIDATOR_CONTINUE_ON_ERROR=${LOCAL_EDM_VALIDATOR_CONTINUE_ON_ERROR:-true}
      - EMIT_EUROPEANA_3D_ADVISORY_FIELDS=${EMIT_EUROPEANA_3D_ADVISORY_FIELDS:-false}
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH:-/srv/webhdp}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/google-credentials.json
      - STORAGE_MODE=${STORAGE_MODE:-local}
      - WEBHDP_SESSIONS_PATH=/shared/sessions
      - LOCAL_INPUT_PATH=/data/local_input
      - LOCAL_OUTPUT_PATH=/data/local_output
      - LOCAL_INPUT_HOST_PATH=/data/local_input
      - LOCAL_OUTPUT_HOST_PATH=/data/local_output
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_DB_BOOTSTRAP=1
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-53687091200}
      - MIN_UPLOAD_FREE_BYTES=${MIN_UPLOAD_FREE_BYTES:-5368709120}
      - MIN_UPLOAD_FREE_MULTIPLIER=${MIN_UPLOAD_FREE_MULTIPLIER:-1.5}
      - SESSION_ARTIFACT_CLEANUP_ENABLED=${SESSION_ARTIFACT_CLEANUP_ENABLED:-false}
      - SESSION_ARTIFACT_RETENTION_SECONDS=${SESSION_ARTIFACT_RETENTION_SECONDS:-2592000}
      - MAINTENANCE_FLAG_PATH=/app/instance/maintenance.json
    volumes:
      - ${WEBHDP_INSTANCE_PATH:-/srv/webhdp/instance}:/app/instance
      - hdp_logs:/app/logs
      - ${WEBHDP_SESSIONS_PATH:-/srv/webhdp/sessions}:/shared/sessions
      - ${CREDENTIALS_HOST_PATH:-/srv/webhdp/credentials}:/run/secrets:ro
      - ${LOCAL_INPUT_HOST_PATH:-/srv/webhdp/local_input}:/data/local_input
      - ${LOCAL_OUTPUT_HOST_PATH:-/srv/webhdp/local_output}:/data/local_output
      - ${BACKUP_LOCAL_DIR:-/srv/webhdp/backups}:/app/backups
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hdp-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    image: ${WEBHDP_FRONTEND_IMAGE:-webhdp-frontend:${WEBHDP_IMAGE_TAG:-0.1.0-alpha.3}}
    restart: unless-stopped
    environment:
      - OEMBED_FRAME_ANCESTORS=${OEMBED_FRAME_ANCESTORS:-'self'}
      - CORS_ALLOWED_ORIGIN=${FRONTEND_URL:-}
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-50G}
    ports:
      - "${WEBHDP_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hdp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  fast-renderer:
    profiles:
      - local-hdp-components
    image: ${WEBHDP_FAST_RENDERER_IMAGE:-webhdp-fast-renderer:${WEBHDP_IMAGE_TAG:-0.1.0-alpha.3}}
    restart: unless-stopped
    volumes:
      - ${WEBHDP_SESSIONS_PATH:-/srv/webhdp/sessions}:/shared/sessions
      - ${LOCAL_INPUT_HOST_PATH:-/srv/webhdp/local_input}:/data/local_input
      - ${LOCAL_OUTPUT_HOST_PATH:-/srv/webhdp/local_output}:/data/local_output
    networks:
      - hdp-network
    environment:
      - LIBGL_ALWAYS_SOFTWARE=1
      - GALLIUM_DRIVER=llvmpipe
      - NVIDIA_VISIBLE_DEVICES=none
      - BLENDER_EGL_SURFACELESS=1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5002/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  any-to-usdz:
    profiles:
      - local-hdp-components
    image: ${WEBHDP_ANY_TO_USDZ_IMAGE:-webhdp-any-to-usdz:${WEBHDP_IMAGE_TAG:-0.1.0-alpha.3}}
    platform: ${ANY_TO_USDZ_PLATFORM:-linux/amd64}
    restart: unless-stopped
    volumes:
      - ${WEBHDP_SESSIONS_PATH:-/srv/webhdp/sessions}:/shared/sessions
      - ${LOCAL_INPUT_HOST_PATH:-/srv/webhdp/local_input}:/data/local_input
      - ${LOCAL_OUTPUT_HOST_PATH:-/srv/webhdp/local_output}:/data/local_output
    networks:
      - hdp-network
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5003/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    restart: unless-stopped
    volumes:
      - hdp_redis:/data
    networks:
      - hdp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    image: ${WEBHDP_BACKEND_IMAGE:-webhdp-backend:${WEBHDP_IMAGE_TAG:-0.1.0-alpha.3}}
    command: celery -A celery_app.celery worker --loglevel=info --time-limit=${CELERY_TASK_TIME_LIMIT:-3600} --soft-time-limit=${CELERY_TASK_SOFT_TIME_LIMIT:-3300}
    restart: unless-stopped
    stop_grace_period: 10m
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/instance/hdp_web.db}
      - FLASK_ENV=production
      - SHARED_SESSION_PATH=/shared/sessions
      - FAST_RENDERER_URL=http://fast-renderer:5002
      - ANY_TO_USDZ_URL=http://any-to-usdz:5003
      - LOCAL_EDM_VALIDATOR_URL=${LOCAL_EDM_VALIDATOR_URL:-http://host.docker.internal:18080}
      - ENABLE_LOCAL_EDM_VALIDATION=${ENABLE_LOCAL_EDM_VALIDATION:-true}
      - LOCAL_EDM_VALIDATOR_REQUIRED=${LOCAL_EDM_VALIDATOR_REQUIRED:-true}
      - LOCAL_EDM_VALIDATOR_CONTINUE_ON_ERROR=${LOCAL_EDM_VALIDATOR_CONTINUE_ON_ERROR:-true}
      - EMIT_EUROPEANA_3D_ADVISORY_FIELDS=${EMIT_EUROPEANA_3D_ADVISORY_FIELDS:-false}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_DB_BOOTSTRAP=0
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-53687091200}
      - MIN_UPLOAD_FREE_BYTES=${MIN_UPLOAD_FREE_BYTES:-5368709120}
      - MIN_UPLOAD_FREE_MULTIPLIER=${MIN_UPLOAD_FREE_MULTIPLIER:-1.5}
      - SESSION_ARTIFACT_CLEANUP_ENABLED=${SESSION_ARTIFACT_CLEANUP_ENABLED:-false}
      - SESSION_ARTIFACT_RETENTION_SECONDS=${SESSION_ARTIFACT_RETENTION_SECONDS:-2592000}
      - MAINTENANCE_FLAG_PATH=/app/instance/maintenance.json
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/google-credentials.json
      - STORAGE_MODE=${STORAGE_MODE:-local}
      - WEBHDP_SESSIONS_PATH=/shared/sessions
      - LOCAL_INPUT_PATH=/data/local_input
      - LOCAL_OUTPUT_PATH=/data/local_output
      - LOCAL_INPUT_HOST_PATH=/data/local_input
      - LOCAL_OUTPUT_HOST_PATH=/data/local_output
    volumes:
      - ${WEBHDP_INSTANCE_PATH:-/srv/webhdp/instance}:/app/instance
      - hdp_logs:/app/logs
      - ${WEBHDP_SESSIONS_PATH:-/srv/webhdp/sessions}:/shared/sessions
      - ${CREDENTIALS_HOST_PATH:-/srv/webhdp/credentials}:/run/secrets:ro
      - ${LOCAL_INPUT_HOST_PATH:-/srv/webhdp/local_input}:/data/local_input
      - ${LOCAL_OUTPUT_HOST_PATH:-/srv/webhdp/local_output}:/data/local_output
      - ${BACKUP_LOCAL_DIR:-/srv/webhdp/backups}:/app/backups
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hdp-network

volumes:
  hdp_logs:
  hdp_redis:

networks:
  hdp-network:
    driver: bridge
