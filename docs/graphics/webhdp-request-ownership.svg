<svg width="820" height="260" viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Request ownership sequence</title><desc id="d">A request moves from Vue view to frontend service, Flask route, Python service, database, then returns as APIResponse data.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#334155"/></marker><style>.b{fill:#e0f2fe;stroke:#334155;stroke-width:1.2}.g{fill:#ecfdf5}.y{fill:#fef9c3}.l{stroke:#334155;stroke-width:1.2;fill:none;marker-end:url(#a)}.r{stroke-dasharray:4 3}text{font:12px system-ui,sans-serif;fill:#0f172a}.s{font-size:10px;fill:#475569}</style></defs><rect width="820" height="260" fill="#fff"/><g class="b"><rect x="35" y="82" width="120" height="60" rx="5"/><rect x="190" y="82" width="120" height="60" rx="5"/><rect class="g" x="345" y="82" width="120" height="60" rx="5"/><rect class="g" x="500" y="82" width="120" height="60" rx="5"/><rect class="y" x="655" y="82" width="130" height="60" rx="5"/></g><g text-anchor="middle"><text x="95" y="116">Vue view</text><text x="250" y="108">Frontend</text><text x="250" y="124">service</text><text x="405" y="108">Flask route</text><text class="s" x="405" y="126">auth + input</text><text x="560" y="108">Python</text><text x="560" y="124">service</text><text x="720" y="108">App DB</text><text x="720" y="124">or .hdpc</text><text class="s" x="410" y="185">Request</text><text class="s" x="410" y="210">APIResponse payload returns to the view</text></g><path class="l" d="M155 102h30M310 102h30M465 102h30M620 102h30"/><path class="l r" d="M655 132h-30M500 132h-30M345 132h-30M190 132h-30"/></svg>
