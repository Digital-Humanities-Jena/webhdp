<svg width="760" height="430" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">WebHDP storage mode flow</title><desc id="d">Standard cloud upload and local storage workflows converge at project scanning and database update.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#334155"/></marker><style>.b{fill:#e0f2fe;stroke:#334155;stroke-width:1.2}.d{fill:#fef9c3}.g{fill:#ecfdf5}.l{stroke:#334155;stroke-width:1.2;fill:none;marker-end:url(#a)}text{font:12px system-ui,sans-serif;fill:#0f172a}.s{font-size:10px;fill:#475569}</style></defs><rect width="760" height="430" fill="#fff"/><path class="b d" d="M380 35l65 55-65 55-65-55z"/><text x="380" y="86" text-anchor="middle">Storage Mode?</text><g class="b"><rect x="70" y="175" width="160" height="58" rx="5"/><rect x="70" y="265" width="160" height="58" rx="5"/><rect x="300" y="175" width="160" height="58" rx="5"/><rect x="530" y="175" width="160" height="58" rx="5"/><rect x="530" y="265" width="160" height="58" rx="5"/><rect class="g" x="300" y="340" width="160" height="58" rx="5"/></g><g text-anchor="middle"><text x="150" y="200">Upload ZIP</text><text class="s" x="150" y="217">standard/cloud</text><text x="150" y="290">Move files to</text><text x="150" y="307">session uploads</text><text x="380" y="200">Validate MSF</text><text x="380" y="217">and inputs</text><text x="610" y="200">Select MSF path</text><text class="s" x="610" y="217">local storage</text><text x="610" y="290">Skip file move</text><text class="s" x="610" y="307">use LOCAL_INPUT</text><text x="380" y="365">HDP Project Scan</text><text x="380" y="382">+ Update DB</text></g><path class="l" d="M315 90H150v75M445 90h165v75M150 233v22M230 294h60q90 0 90-52M610 233v22M530 294h-60q-90 0-90-52M380 233v97"/></svg>
