<svg width="850" height="520" viewBox="0 0 850 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Doctor troubleshooting decision tree</title><desc id="d">When make doctor fails, check Python, Node, environment, Docker, docs, API contract, golden workflow, then focused tests.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#334155"/></marker><style>.b{fill:#e0f2fe;stroke:#334155;stroke-width:1.2}.g{fill:#ecfdf5}.y{fill:#fef9c3}.x{fill:#f8fafc}.l{stroke:#334155;stroke-width:1.2;fill:none;marker-end:url(#a)}text{font:12px system-ui,sans-serif;fill:#0f172a}.h{font-weight:700}</style></defs><rect width="850" height="520" fill="#fff"/><rect class="b y" x="325" y="25" width="200" height="55" rx="8"/><text class="h" x="425" y="58" text-anchor="middle">make doctor failed</text><g class="b"><rect x="70" y="150" width="190" height="110" rx="6"/><rect class="g" x="330" y="150" width="190" height="110" rx="6"/><rect class="y" x="590" y="150" width="190" height="110" rx="6"/><rect class="x" x="115" y="355" width="210" height="85" rx="6"/><rect class="x" x="525" y="355" width="210" height="85" rx="6"/></g><g><text class="h" x="90" y="180">Environment</text><text x="90" y="205">Python / uv</text><text x="90" y="225">Node / npm</text><text x="90" y="245">.env present</text><text class="h" x="350" y="180">Infrastructure</text><text x="350" y="205">Docker / Compose</text><text x="350" y="225">Redis / Celery</text><text x="350" y="245">database bootstrap</text><text class="h" x="610" y="180">Project checks</text><text x="610" y="205">docs + API contract</text><text x="610" y="225">golden workflow</text><text x="610" y="245">focused test</text><text x="220" y="398" text-anchor="middle">Fix the first failing branch</text><text x="220" y="418" text-anchor="middle">then rerun make doctor</text><text x="630" y="398" text-anchor="middle">Use focused logs/tests</text><text x="630" y="418" text-anchor="middle">when broad checks pass</text></g><path class="l" d="M425 80v45H165v25M425 125v25M425 125h260v25M425 260v55H220v40M425 315h205v40"/></svg>
