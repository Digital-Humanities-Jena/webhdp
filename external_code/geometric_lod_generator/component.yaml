metadata:
  name: geometric_lod_generator
  label: Geometric LOD Generator
  description: Produces lightweight derivative placeholders and reports for web-viewing level-of-detail workflows.
  tags: [3d, lod, optimization, derivative]
  category: 3D Processing
  version: "1.0.0"
  status: alpha
  component_schema: "0.1.0-alpha.1"

distribution:
  tier: external_installable
  bundled_with_webhdp: false
  installation_scope: [local_container]

inputs:
  - name: input_file
    label: Input 3D Asset
    type: file_path
    required: true

outputs:
  - name: analysis_report
    type: file_path
  - name: lod_preview
    type: file_path

parameter_groups:
  - title: Optimization
    parameters:
      - name: target_ratio
        label: Target Ratio
        type: number
        default: 0.5

execution:
  profiles:
    - id: local_docker
      adapter: container_cli
      runtime: docker
      image: webhdp-geometric-lod-generator:local
      entrypoint: [python, /app/component_runner.py, --component, geometric_lod_generator]
      config:
        webhdp_contract: true
      resources:
        gpu_count: 0
        cpus: 1
        memory_mb: 2048

compatibility:
  playground:
    enabled: true

install:
  strategies:
    - id: local_container
      runtime: docker
      profile: local_docker
      image: webhdp-geometric-lod-generator:local
  test:
    files:
      - name: sample.glb
        content_base64: "Z2xURgIAAAAwAAAAHAAAAEpTT057ImFzc2V0Ijp7InZlcnNpb24iOiIyLjAifX0g"
    inputs:
      input_file: sample.glb
    parameters:
      target_ratio: 0.5

ui:
  playground:
    fields:
      input_file:
        widget: model_input
        accept_extensions: [.glb, .gltf, .obj, .ply]
      target_ratio:
        widget: number_input
    result:
      artifact_views:
        - id: lod-report
          label: LOD Report
          widget: file_download
          extensions: [.json]
      show_result_json: true
      show_logs: true
