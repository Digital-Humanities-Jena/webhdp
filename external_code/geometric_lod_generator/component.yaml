metadata:
  name: geometric_lod_generator
  label: Geometric LOD Generator
  description: Generate three GLB detail levels on the CPU, retaining preceding geometry when sampled surface error exceeds the limit. Static embedded GLB only.
  tags: [3d, lod, optimization, derivative]
  category: 3D Processing
  version: "1.0.2"
  status: alpha
  component_schema: "0.1.0-alpha.1"

distribution:
  tier: external_installable
  bundled_with_webhdp: false
  installation_scope: [local_container]

inputs:
  - name: input_file
    label: Input 3D Asset
    type: file_path
    required: true

outputs:
  - name: analysis_report
    type: file_path
  - name: lod_preview
    type: file_path
  - {name: lod_high, label: High detail GLB, type: file_path}
  - {name: lod_medium, label: Medium detail GLB, type: file_path}
  - {name: lod_low, label: Low detail GLB, type: file_path}

parameter_groups:
  - title: Optimization
    parameters:
      - name: target_ratio
        label: Target Ratio
        type: number
        default: 0.5
        description: Fraction of source triangles targeted by the medium level, strictly between 0 and 1. High uses its square root; low uses its square.
      - name: max_relative_error
        label: Surface error limit
        type: number
        default: 0.001
        description: Sampled error as a fraction of each mesh bounding-box diagonal, strictly between 0 and 0.1. Geometry is retained when this limit is exceeded.

execution:
  timeout: 600
  profiles:
    - id: local_docker
      adapter: container_cli
      runtime: docker
      image: webhdp-geometric-lod-generator:local
      entrypoint: [python, /app/component_runner.py, --component, geometric_lod_generator]
      config:
        webhdp_contract: true
      resources:
        gpu_count: 0
        cpus: 1
        memory_mb: 8192

compatibility:
  playground:
    enabled: true

install:
  strategies:
    - id: local_container
      runtime: docker
      profile: local_docker
      image: webhdp-geometric-lod-generator:local
  test:
    files:
      - name: sample.glb
        content_base64: ""
    inputs:
      input_file: sample.glb
    parameters:
      target_ratio: 0.5

ui:
  playground:
    fields:
      input_file:
        widget: model_input
        accept_extensions: [.glb]
        help_text: Static GLB with embedded textures and one scene. Animations, skins and external dependencies are rejected. Originals remain unchanged.
      target_ratio:
        widget: number_input
      max_relative_error:
        widget: number_input
    result:
      artifact_views:
        - {id: lod-models, label: Detail levels, widget: file_download, extensions: [.glb]}
        - id: lod-report
          label: LOD Report
          widget: file_download
          extensions: [.json]
      show_result_json: true
      show_logs: true
