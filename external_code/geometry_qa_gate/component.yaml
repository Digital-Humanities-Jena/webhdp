metadata:
  name: geometry_qa_gate
  label: Geometry QA / Publishability Gate
  description: Evaluates geometry and dependency risk and returns pass, manual review, or quarantine recommendations.
  tags: [3d, qa, publishability, validation]
  category: 3D QA
  version: "1.0.0"
  status: alpha
  component_schema: "0.1.0-alpha.1"

distribution:
  tier: external_installable
  bundled_with_webhdp: false
  installation_scope: [local_container]

inputs:
  - name: input_file
    label: Input 3D Asset
    type: file_path
    required: true

outputs:
  - name: analysis_report
    label: QA Report
    type: file_path

parameter_groups:
  - title: QA Policy
    parameters:
      - name: strict
        label: Strict Mode
        type: boolean
        default: false

execution:
  profiles:
    - id: local_docker
      adapter: container_cli
      runtime: docker
      image: webhdp-geometry-qa-gate:local
      entrypoint: [python, /app/component_runner.py, --component, geometry_qa_gate]
      config:
        webhdp_contract: true
      resources:
        gpu_count: 0
        cpus: 1
        memory_mb: 1024

compatibility:
  playground:
    enabled: true

install:
  strategies:
    - id: local_container
      runtime: docker
      profile: local_docker
      image: webhdp-geometry-qa-gate:local
  test:
    files:
      - name: sample.glb
        content_base64: "Z2xURgIAAAAwAAAAHAAAAEpTT057ImFzc2V0Ijp7InZlcnNpb24iOiIyLjAifX0g"
    inputs:
      input_file: sample.glb
    parameters:
      strict: false

ui:
  playground:
    fields:
      input_file:
        widget: model_input
        accept_extensions: [.glb, .gltf, .obj, .ply]
      strict:
        widget: checkbox
    result:
      artifact_views:
        - id: qa-report
          label: QA Report
          widget: file_download
          extensions: [.json]
      show_result_json: true
      show_logs: true
