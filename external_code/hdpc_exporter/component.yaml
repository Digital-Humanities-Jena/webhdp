metadata:
  name: hdpc_exporter
  label: HDPC to CSV Exporter
  description: Export checked HDPC tables through a read-only SQLite connection, with
    bounded rows and spreadsheet-safe CSV cells.
  version: 1.0.1
  status: alpha
  component_schema: 0.1.0-alpha.1
  category: Zenodo HDP Components
  tags:
  - zenodo-community
  - metadata
  - validation
  license:
    type: GPL-3.0-or-later
sources:
  record: https://zenodo.org/records/16995063
  doi: 10.5281/zenodo.16995063
distribution:
  tier: external_installable
  bundled_with_webhdp: false
  installation_scope:
  - local_container
  - hpc_sif
inputs:
- name: input_file
  label: Source HDPC database
  type: file_path
  required: true
outputs:
- name: csv_file
  label: CSV export
  type: file_path
  required: true
  extensions:
  - .csv
- name: export_report
  label: Export report
  type: file_path
  required: true
  extensions:
  - .json
parameter_groups:
- title: Processing settings
  parameters:
  - name: export_mode
    label: Export mode
    type: string
    default: files_overview
    enum:
    - files_overview
    - zenodo_records
    - metadata_export
    - project_summary
    - api_log
    - custom
  - name: table
    label: Table for custom export
    type: string
    default: source_files
  - name: columns
    label: Columns (comma separated; empty means all)
    type: string
    default: ''
  - name: filter_status
    label: Status filter
    type: string
    default: ''
  - name: date_range_start
    label: Start date (YYYY-MM-DD)
    type: string
    default: ''
  - name: date_range_end
    label: End date (YYYY-MM-DD)
    type: string
    default: ''
  - name: include_project_info
    label: Include project names
    type: boolean
    default: true
  - name: max_rows
    label: Maximum exported rows
    type: integer
    default: 10000
    minimum: 1
    maximum: 100000
execution:
  timeout: 600
  profiles:
  - id: local_docker
    adapter: container_cli
    runtime: docker
    image: webhdp-zenodo-components:local
    entrypoint:
    - python
    - /app/component_runner.py
    - hdpc_exporter
    config:
      webhdp_contract: true
      network: none
    resources:
      gpu_count: 0
      cpus: 2
      memory_mb: 4096
  - id: hpc_singularity
    adapter: hpc_link
    handler: generic_singularity_component
    runtime: singularity
    image: ''
    entrypoint:
    - python
    - /app/component_runner.py
    - hdpc_exporter
    resources:
      gpu_count: 0
      cpus: 2
      memory_mb: 4096
compatibility:
  playground:
    enabled: true
install:
  strategies:
  - id: local_container
    runtime: docker
    profile: local_docker
    image: webhdp-zenodo-components:local
  - id: hpc_sif
    runtime: singularity
    profile: hpc_singularity
  test: &id001
    files:
    - name: sample.hdpc
      content_base64: 
    inputs:
      input_file: sample.hdpc
    parameters: {}
hpc:
  install:
    runtime: singularity
    sif_required: true
  test: *id001
ui:
  playground:
    fields:
      input_file:
        widget: file_picker
        accept_extensions:
        - .hdpc
        - .sqlite
        - .sqlite3
        - .db
    result:
      artifact_views:
      - id: results
        label: Reports and exported data
        widget: file_download
        extensions:
        - .json
        - .csv
      show_result_json: true
      show_logs: true
