metadata:
  name: historic_pairs
  label: Historic Image Pair Selection
  description: Select exhaustive or GPS-neighbour image pairs for a prepared image
    dataset.
  tags:
  - historic-reconstruction
  - photogrammetry
  - colmap
  category: Historic Reconstruction
  version: 1.0.1
  status: alpha
  component_schema: 0.1.0-alpha.1
distribution:
  tier: external_installable
  bundled_with_webhdp: false
  installation_scope:
  - local_container
  - hpc_sif
inputs:
- name: input_file
  label: Prepared image dataset ZIP
  type: file_path
  required: true
- name: gps_file
  label: Image GPS coordinates (JSON)
  type: file_path
  bind_source_by_default: false
  description: Required for GPS selection. Keys are original or prepared image names;
    values are [latitude, longitude].
outputs:
- name: dataset
  label: Dataset
  type: file_path
  extensions:
  - .zip
  required: true
- name: pairs
  label: Pairs
  type: file_path
  extensions:
  - .txt
  required: true
- name: report
  label: Report
  type: file_path
  extensions:
  - .json
  required: true
parameter_groups:
- title: Processing settings
  parameters:
  - name: method
    label: Pair selection
    type: string
    default: exhaustive
    enum:
    - exhaustive
    - gps
  - name: max_neighbors
    label: Maximum GPS neighbours
    type: integer
    default: 20
    minimum: 1
    maximum: 10000
  - name: radius_m
    label: GPS search radius (metres)
    type: number
    default: 1000
    minimum: 1
    maximum: 10000000
execution:
  timeout: 7200
  profiles:
  - id: local_docker
    adapter: container_cli
    runtime: docker
    image: webhdp-historic-reconstruction:local
    entrypoint:
    - python
    - /app/component_runner.py
    - pairs
    config:
      webhdp_contract: true
      network: none
    resources:
      gpu_count: 0
      cpus: 4
      memory_mb: 8192
  - id: hpc_singularity
    adapter: hpc_link
    handler: generic_singularity_component
    runtime: singularity
    image: ''
    entrypoint:
    - python
    - /app/component_runner.py
    - pairs
    resources:
      gpu_count: 0
      cpus: 2
      memory_mb: 8192
compatibility:
  playground:
    enabled: true
install:
  strategies:
  - id: local_container
    runtime: docker
    profile: local_docker
    image: webhdp-historic-reconstruction:local
  - id: hpc_sif
    runtime: singularity
    profile: hpc_singularity
  test:
    description: Synthetic image preparation/pair contract fixture; no reconstruction
      accuracy claim.
    files:
    - name: prepared-images.zip
      content_base64: 
    inputs:
      input_file: prepared-images.zip
    parameters: {}
hpc:
  install:
    runtime: singularity
    sif_required: true
  test:
    description: Synthetic image preparation/pair contract fixture; no reconstruction
      accuracy claim.
    files:
    - name: prepared-images.zip
      content_base64: 
    inputs:
      input_file: prepared-images.zip
    parameters: {}
ui:
  playground:
    fields:
      input_file:
        widget: file_picker
        accept_extensions:
        - .zip
      gps_file:
        widget: file_picker
        accept_extensions:
        - .json
    result:
      artifact_views:
      - id: results
        label: Scientific artifacts and reports
        widget: file_download
        extensions:
        - .json
        - .txt
        - .zip
      show_result_json: true
      show_logs: true
