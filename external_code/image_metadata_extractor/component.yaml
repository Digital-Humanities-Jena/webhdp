metadata:
  name: image_metadata_extractor
  label: Image Metadata Extractor
  description: Extract image dimensions, EXIF, camera details and privacy-filtered
    metadata using the published Zenodo processor. Source images remain unchanged.
  tags:
  - metadata
  - zenodo-community
  category: Metadata Extraction
  version: 1.1.1
  status: alpha
  component_schema: 0.1.0-alpha.1
  license:
    type: GPL-3.0-or-later
distribution:
  tier: external_installable
  bundled_with_webhdp: false
  installation_scope:
  - local_container
  - hpc_sif
inputs:
- name: input_file
  label: Image file
  type: file_path
  required: true
outputs:
- name: metadata_report
  label: Metadata report
  type: file_path
  extensions:
  - .json
  required: true
parameter_groups:
- title: Extraction settings
  parameters:
  - name: remove_address
    label: Filter addresses
    description: Heuristically filter addresses from selected text fields.
    type: boolean
    default: true
  - name: remove_mail
    label: Filter email addresses
    description: Heuristically filter email addresses from selected text fields.
    type: boolean
    default: true
  - name: include_technical_details
    label: Include technical EXIF
    description: Include camera exposure and technical EXIF fields.
    type: boolean
    default: true
  - name: readable_maker_notes_only
    label: Readable maker notes only
    description: Omit binary maker notes that the published processor considers unreadable.
    type: boolean
    default: true
  - name: include_hash
    label: Include SHA-256
    description: Include the source checksum in basic image facts.
    type: boolean
    default: true
  - name: remove_gps
    label: Omit GPS metadata
    description: Omit GPS fields from the report. The source image is unchanged.
    type: boolean
    default: true
execution:
  timeout: 300
  profiles:
  - id: local_docker
    adapter: container_cli
    runtime: docker
    image: webhdp-zenodo-components:local
    entrypoint:
    - python
    - /app/component_runner.py
    - image_metadata_extractor
    config:
      webhdp_contract: true
      network: none
    resources:
      gpu_count: 0
      cpus: 2
      memory_mb: 4096
  - id: hpc_singularity
    adapter: hpc_link
    handler: generic_singularity_component
    runtime: singularity
    image: ''
    entrypoint:
    - python
    - /app/component_runner.py
    - image_metadata_extractor
    resources:
      gpu_count: 0
      cpus: 2
      memory_mb: 4096
compatibility:
  playground:
    enabled: true
install:
  strategies:
  - id: local_container
    runtime: docker
    profile: local_docker
    image: webhdp-zenodo-components:local
  - id: hpc_sif
    runtime: singularity
    profile: hpc_singularity
  test: &id001
    description: Measured metadata fixture using the published processor; assertions
      are verified by the runtime regression suite.
    files:
    - name: metadata-photo.jpg
      content_base64: 
    inputs:
      input_file: metadata-photo.jpg
    parameters: {}
hpc:
  install:
    runtime: singularity
    sif_required: true
  test: *id001
ui:
  playground:
    fields:
      input_file:
        widget: image_input
        accept_extensions:
        - .png
        - .jpg
        - .jpeg
        - .gif
        - .webp
        - .tif
        - .tiff
        - .bmp
      remove_address:
        widget: checkbox
      remove_mail:
        widget: checkbox
      include_technical_details:
        widget: checkbox
      readable_maker_notes_only:
        widget: checkbox
      include_hash:
        widget: checkbox
      remove_gps:
        widget: checkbox
    result:
      artifact_views:
      - id: metadata-json
        label: Metadata report
        widget: file_download
        extensions:
        - .json
      show_result_json: true
      show_logs: true
sources:
  record: https://zenodo.org/records/16944352
  doi: 10.5281/zenodo.16944352
