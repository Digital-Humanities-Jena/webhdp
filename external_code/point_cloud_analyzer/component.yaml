metadata:
  name: point_cloud_analyzer
  label: Point Cloud Analyzer
  description: Inspects PLY/LAS/LAZ/E57-style point cloud assets for counts, fields, and point-cloud readiness hints.
  tags: [3d, point-cloud, ply, las, e57]
  category: 3D Analysis
  version: "1.0.0"
  status: alpha
  component_schema: "0.1.0-alpha.1"

distribution:
  tier: external_installable
  bundled_with_webhdp: false
  installation_scope: [local_container]

inputs:
  - name: input_file
    label: Input Point Cloud
    type: file_path
    required: true

outputs:
  - name: analysis_report
    type: file_path

execution:
  profiles:
    - id: local_docker
      adapter: container_cli
      runtime: docker
      image: webhdp-point-cloud-analyzer:local
      entrypoint: [python, /app/component_runner.py, --component, point_cloud_analyzer]
      config:
        webhdp_contract: true
      resources:
        gpu_count: 0
        cpus: 1
        memory_mb: 1024

compatibility:
  playground:
    enabled: true

install:
  strategies:
    - id: local_container
      runtime: docker
      profile: local_docker
      image: webhdp-point-cloud-analyzer:local
  test:
    files:
      - name: sample.ply
        content: |
          ply
          format ascii 1.0
          element vertex 1
          property float x
          property float y
          property float z
          end_header
          0 0 0
    inputs:
      input_file: sample.ply
    parameters: {}

ui:
  playground:
    fields:
      input_file:
        widget: model_input
        accept_extensions: [.ply, .las, .laz, .e57]
    result:
      artifact_views:
        - id: point-cloud-report
          label: Point Cloud Report
          widget: file_download
          extensions: [.json]
      show_result_json: true
      show_logs: true
