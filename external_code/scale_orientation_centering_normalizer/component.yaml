metadata:
  name: scale_orientation_centering_normalizer
  label: Scale, Orientation, And Centering Normalizer
  description: Analyzes spatial orientation, origin, and scale risks and optionally emits a derivative without mutating the original.
  tags: [3d, scale, orientation, centering]
  category: 3D Processing
  version: "1.0.0"
  status: alpha
  component_schema: "0.1.0-alpha.1"

distribution:
  tier: external_installable
  bundled_with_webhdp: false
  installation_scope: [local_container]

inputs:
  - name: input_file
    label: Input 3D Asset
    type: file_path
    required: true

outputs:
  - name: analysis_report
    type: file_path
  - name: normalized_asset
    type: file_path

parameter_groups:
  - title: Spatial Policy
    parameters:
      - name: target_up_axis
        label: Target Up Axis
        type: string
        default: Y
        options: [Y, Z]
      - name: apply_changes
        label: Emit Normalized Derivative
        type: boolean
        default: false

execution:
  profiles:
    - id: local_docker
      adapter: container_cli
      runtime: docker
      image: webhdp-scale-orientation-centering-normalizer:local
      entrypoint: [python, /app/component_runner.py, --component, scale_orientation_centering_normalizer]
      config:
        webhdp_contract: true
      resources:
        gpu_count: 0
        cpus: 1
        memory_mb: 1024

compatibility:
  playground:
    enabled: true

install:
  strategies:
    - id: local_container
      runtime: docker
      profile: local_docker
      image: webhdp-scale-orientation-centering-normalizer:local
  test:
    files:
      - name: sample.glb
        content_base64: "Z2xURgIAAAAwAAAAHAAAAEpTT057ImFzc2V0Ijp7InZlcnNpb24iOiIyLjAifX0g"
    inputs:
      input_file: sample.glb
    parameters:
      target_up_axis: Y
      apply_changes: false

ui:
  playground:
    fields:
      input_file:
        widget: model_input
        accept_extensions: [.glb, .gltf, .obj, .ply]
      target_up_axis:
        widget: select
      apply_changes:
        widget: checkbox
    result:
      artifact_views:
        - id: spatial-report
          label: Spatial Report
          widget: file_download
          extensions: [.json]
      show_result_json: true
      show_logs: true
