metadata:
  name: texture_dependency_auditor
  label: Texture And Dependency Auditor
  description: Checks external texture, MTL, and glTF image references before rendering, normalization, or publication.
  tags: [3d, textures, dependencies, audit]
  category: 3D QA
  version: "1.0.0"
  status: alpha
  component_schema: "0.1.0-alpha.1"

distribution:
  tier: external_installable
  bundled_with_webhdp: false
  installation_scope: [local_container]

inputs:
  - name: input_file
    label: Input 3D Asset
    type: file_path
    required: true

outputs:
  - name: analysis_report
    label: Dependency Audit Report
    type: file_path

execution:
  profiles:
    - id: local_docker
      adapter: container_cli
      runtime: docker
      image: webhdp-texture-dependency-auditor:local
      entrypoint: [python, /app/component_runner.py, --component, texture_dependency_auditor]
      config:
        webhdp_contract: true
      resources:
        gpu_count: 0
        cpus: 1
        memory_mb: 1024

compatibility:
  playground:
    enabled: true

install:
  strategies:
    - id: local_container
      runtime: docker
      profile: local_docker
      image: webhdp-texture-dependency-auditor:local
  test:
    files:
      - name: sample.glb
        content_base64: "Z2xURgIAAAAwAAAAHAAAAEpTT057ImFzc2V0Ijp7InZlcnNpb24iOiIyLjAifX0g"
    inputs:
      input_file: sample.glb
    parameters: {}

ui:
  playground:
    fields:
      input_file:
        widget: model_input
        accept_extensions: [.glb, .gltf, .obj]
    result:
      artifact_views:
        - id: dependency-report
          label: Dependency Report
          widget: file_download
          extensions: [.json]
      show_result_json: true
      show_logs: true
