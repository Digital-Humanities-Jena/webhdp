metadata:
  name: viewer_readiness_analyzer
  label: Viewer Readiness / Web Delivery Analyzer
  description: Scores web and mobile viewer suitability based on size, texture count, and model complexity hints.
  tags: [3d, viewer, web-delivery, readiness]
  category: 3D QA
  version: "1.0.0"
  status: alpha
  component_schema: "0.1.0-alpha.1"

distribution:
  tier: external_installable
  bundled_with_webhdp: false
  installation_scope: [local_container]

inputs:
  - name: input_file
    label: Input 3D Asset
    type: file_path
    required: true

outputs:
  - name: analysis_report
    type: file_path

execution:
  profiles:
    - id: local_docker
      adapter: container_cli
      runtime: docker
      image: webhdp-viewer-readiness-analyzer:local
      entrypoint: [python, /app/component_runner.py, --component, viewer_readiness_analyzer]
      config:
        webhdp_contract: true
      resources:
        gpu_count: 0
        cpus: 1
        memory_mb: 1024

compatibility:
  playground:
    enabled: true

install:
  strategies:
    - id: local_container
      runtime: docker
      profile: local_docker
      image: webhdp-viewer-readiness-analyzer:local
  test:
    files:
      - name: sample.glb
        content_base64: "Z2xURgIAAAAwAAAAHAAAAEpTT057ImFzc2V0Ijp7InZlcnNpb24iOiIyLjAifX0g"
    inputs:
      input_file: sample.glb
    parameters: {}

ui:
  playground:
    fields:
      input_file:
        widget: model_input
        accept_extensions: [.glb, .gltf, .obj, .ply]
    result:
      artifact_views:
        - id: viewer-readiness-report
          label: Viewer Readiness Report
          widget: file_download
          extensions: [.json]
      show_result_json: true
      show_logs: true
