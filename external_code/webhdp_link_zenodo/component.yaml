metadata:
  name: link_zenodo_sandbox_draft
  label: Zenodo Sandbox draft upload
  description: Create an unpublished Sandbox draft, upload prepared model files, and download every file to verify its size and SHA-256. Publishing is not implemented.
  version: 1.0.0
  component_schema: 0.1.0-alpha.1
  status: alpha
  tags: [webhdp-link, sandbox-validation]
distribution:
  tier: operator_managed
  bundled_with_webhdp: true
inputs:
  - {name: metadata_file, label: Prepared metadata, type: file_path, required: true, extensions: [.json]}
  - {name: model_file, label: Converted model, type: file_path, required: true, extensions: [.glb]}
  - {name: mesh_report, label: Geometry report, type: file_path, required: true, extensions: [.json]}
  - {name: package_file, label: Prepared package, type: file_path, required: true, extensions: [.zip]}
  - {name: source, label: Original model, type: file_path, required: true, extensions: [.obj]}
outputs:
  - {name: sandbox_receipt, label: Unpublished Sandbox draft receipt, type: file_path, required: true, extensions: [.json]}
parameter_groups:
  - title: Draft metadata
    parameters:
      - {name: creator_name, label: Creator name, type: string, default: WebHDP-Link validation}
execution:
  profiles:
    - id: local
      adapter: local_cli
      entrypoint: [python3, runner.py]
      output_collection:
        - {name: sandbox_receipt, path: zenodo-sandbox-receipt.json}
      resources: {gpu_count: 0, cpus: 1, memory_mb: 512}
compatibility:
  playground:
    enabled: false
