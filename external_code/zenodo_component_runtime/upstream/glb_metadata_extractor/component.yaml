metadata:
  name: glb_metadata_extractor
  label: GLB Metadata Extractor
  description: >
    Extracts comprehensive metadata from GLB/glTF 3D model files including scene information, 
    mesh statistics, bounding box, dimensions, and used extensions.
  tags:
    - 3d
    - model
    - glb
    - gltf
    - metadata
  keywords:
    - 3d model
    - gltf
    - glb
    - extractor
    - bounding box
    - mesh
  category: 3D Processing
  version: "0.1.0"
  status: alpha
  created: "2025-08-23"
  updated: "2025-08-23"
  authors:
    - name: "Ukolov, Dominik"
      affiliation: "Friedrich-Schiller-University Jena"
      orcid: "0000-0002-7904-3892"
  contact:
    email: "dominik.ukolov@uni-jena.de"
  license:
    type: GPLv3
    url: "https://www.gnu.org/licenses/gpl-3.0.html.en"
  component_schema: "0.1.0-alpha.2"

sources:
  record: ""
  doi: ""
  concept_doi: ""
  git: ""

structure:
  required_files:
    - processor.py
    - main.py
    - tests/test.py
    - tests/sample.glb
    - tests/reference_data/sample_glb_metadata.json
    - CHANGELOG.md
  additional_files: []
  directories:
    - tests/output_reports

inputs:
  - name: input-file
    label: Input GLB/glTF File
    description: >
      Path to the input GLB or glTF file that will be analyzed.
    type: file_path
    default: ""
    required: true
    validation_rules:
      file_extensions: [".glb", ".gltf"]
    mutex_with: ["input-dir"]

  - name: input-dir
    label: Input Directory
    description: >
      Path to a directory containing GLB and/or glTF files to be analyzed in batch.
    type: dir_path
    default: ""
    required: true
    validation_rules:
      file_extensions: [".glb", ".gltf"]
    mutex_with: ["input-file"]

outputs:
  - name: output-file
    label: GLB Metadata Report
    pattern: "{original_stem}_glb_metadata.json"
    description: >
      JSON report containing comprehensive metadata and statistics for the 3D model(s).
    category: metadata
    type: "application/json"

parameter_groups:
  - title: Analysis Options
    description: Configure the level of detail for the metadata extraction.
    parameters:
      - name: include-detailed-primitives
        label: Include Detailed Primitive Information
        type: boolean
        default: false
        description: >
          If true, includes detailed information about each primitive, which can be verbose.
      - name: calculate-volume
        label: Calculate Approximate Volume
        type: boolean
        default: true
        description: >
          If true, calculates the approximate volume based on the model's bounding box.
      - name: include-extension-details
        label: Include Extension Details
        type: boolean
        default: true
        description: >
          If true, includes detailed information about the glTF extensions used in the model.
  
  - title: Execution Options
    description: Configure execution behavior and logging.
    parameters:
      - name: test
        label: Run Internal Test Suite
        type: boolean
        default: false
        description: >
          If true, runs the component's built-in test suite instead of processing input files.
      - name: config
        label: Configuration File
        type: file_path
        description: >
          Optional path to a JSON configuration file with advanced settings.
        validation_rules:
          file_extensions: [".json"]
      - name: verbose
        label: Enable Verbose Logging
        type: boolean
        default: false
        description: >
          If enabled, prints detailed processing steps and results to the console.

requirements:
  python_environment:
    python_version: ">=3.8"
    packages:
      - name: "pygltflib"
        version: ">=1.16.0"
  system_dependencies: []
  system_requirements:
    min_memory_mb: 256
    recommended_memory_mb: 1024

execution:
  idempotent: true
  timeout: 180
  on_error: continue_with_warning