metadata:
  name: mtl_metadata_extractor
  label: MTL Metadata Extractor
  description: >
    Extracts comprehensive metadata from MTL (material) files associated with OBJ 3D models, 
    including material properties, texture mappings, and file references.
  tags:
    - 3d
    - model
    - obj
    - mtl
    - material
    - texture
  keywords:
    - material library
    - texture mapping
    - mtl
    - obj
    - metadata
  category: 3D Processing
  version: "0.1.0"
  status: alpha
  created: "2025-08-23"
  updated: "2025-08-23"
  authors:
    - name: "Ukolov, Dominik"
      affiliation: "Friedrich-Schiller-University Jena"
      orcid: "0000-0002-7904-3892"
  contact:
    email: "dominik.ukolov@uni-jena.de"
  license:
    type: GPLv3
    url: "https://www.gnu.org/licenses/gpl-3.0.html.en"
  component_schema: "0.1.0-alpha.2"

sources:
  record: ""
  doi: ""
  concept_doi: ""
  git: ""

structure:
  required_files:
    - processor.py
    - main.py
    - CHANGELOG.md
    - tests/test.py
    - tests/sample.obj
    - tests/sample.mtl
    - tests/textures/17th_c_red_english_bond_grey_to_reddish_brown_Base_Color.jpg
    - tests/textures/old_brick_oiled_one_layer_Base_Color.jpg
    - tests/textures/old_brick_oiled_one_layer_Roughness.jpg
    - tests/textures/rough_wood_COLOR_painted.jpg
    - tests/textures/rough_wood_NRM_y_up.jpg
    - tests/textures/rough_wood_ROUGH.jpg
    - tests/textures/TexturesCom_RooftilesCeramic0021_1_seamless_S_red_pimped.jpg
    - tests/textures/voordeurenkel.jpg
    - tests/reference_data/sample_mtl_metadata.json
  additional_files: []
  directories:
    - tests/output_reports

inputs:
  - name: input-file
    label: Input OBJ File
    description: >
      Path to the OBJ file that references the MTL file(s) to be analyzed.
    type: file_path
    default: ""
    required: true
    validation_rules:
      file_extensions: [".obj"]
    mutex_with: ["input-dir"]

  - name: input-dir
    label: Input Directory
    description: >
      Path to a directory containing OBJ files for batch analysis of their referenced MTL files.
    type: dir_path
    default: ""
    required: true
    validation_rules:
      file_extensions: [".obj"]
    mutex_with: ["input-file"]

outputs:
  - name: output-file
    label: MTL Metadata Report
    pattern: "{original_stem}_mtl_metadata.json"
    description: >
      JSON report containing comprehensive metadata and analysis for the referenced MTL file(s).
    category: metadata
    type: "application/json"

parameter_groups:
  - title: Analysis Options
    description: Configure the behavior of the MTL and texture analysis.
    parameters:
      - name: validate-texture-files
        label: Validate Texture File Existence
        type: boolean
        default: true
        description: >
          If true, checks if referenced texture files (e.g., map_Kd) actually exist on disk.
      - name: include-material-analysis
        label: Include Material Analysis
        type: boolean
        default: true
        description: >
          If true, performs a detailed analysis of material properties and usage patterns.
      - name: search-texture-directories
        label: Search Texture Directories
        type: boolean
        default: true
        description: >
          If true, searches common subdirectories (e.g., 'textures', 'maps') for missing textures.
      - name: parse-advanced-properties
        label: Parse Advanced Properties
        type: boolean
        default: true
        description: >
          If true, parses advanced MTL properties like bump maps, displacement, and reflection maps.
  
  - title: Execution Options
    description: Configure execution behavior and logging.
    parameters:
      - name: test
        label: Run Internal Test Suite
        type: boolean
        default: false
        description: >
          If true, runs the component's built-in test suite instead of processing input files.
      - name: config
        label: Configuration File
        type: file_path
        description: >
          Optional path to a JSON configuration file with advanced settings.
        validation_rules:
          file_extensions: [".json"]
      - name: verbose
        label: Enable Verbose Logging
        type: boolean
        default: false
        description: >
          If enabled, prints detailed processing steps and results to the console.

requirements:
  python_environment:
    python_version: ">=3.8"
    packages:
      - name: "PyYAML"
        version: ">=6.0"
  system_dependencies: []
  system_requirements:
    min_memory_mb: 256

execution:
  idempotent: true
  timeout: 120
  on_error: continue_with_warning