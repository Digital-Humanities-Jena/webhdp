# OAuth callback parameters, authorization headers and old verification links are excluded from access logs.
map $uri $webhdp_logged_uri {
    ~^/verify-email/                 /verify-email/[redacted];
    ~^/api/v1/auth/verify-email/     /api/v1/auth/verify-email/[redacted];
    default                         $uri;
}
log_format webhdp_safe '$remote_addr $request_method $webhdp_logged_uri $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log webhdp_safe;

    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https://zenodo.org https://sandbox.zenodo.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Public oEmbed iframe surface. This route intentionally allows framing while
    # keeping the rest of the authenticated app covered by the backend defaults.
    location ^~ /embed/records/ {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors ${OEMBED_FRAME_ANCESTORS}; img-src 'self' data: blob: https://zenodo.org https://sandbox.zenodo.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://zenodo.org https://sandbox.zenodo.org; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Serve Vue App
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Backend Container
    # Link owns its exact-origin authorization and preflight responses. Never
    # strip Origin or handle its OPTIONS in the legacy generic API location.
    location ^~ /api/v1/link/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_request_buffering off;
        proxy_read_timeout 1200s;
        proxy_connect_timeout 1200s;
        proxy_send_timeout 1200s;
        client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};
    }

    location /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";

        # Increase timeouts for large uploads
        proxy_read_timeout 1200s;
        proxy_connect_timeout 1200s;
        proxy_send_timeout 1200s;

        # Important: Also set client_max_body_size for this location
        client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};
    }
}
