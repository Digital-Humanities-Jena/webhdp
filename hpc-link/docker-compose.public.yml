services:
  app-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://host.docker.internal:18000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  hpc-pi3:
    build:
      context: ./hpc-pi3
      dockerfile: Dockerfile
    ports:
      - "5181:8080"
    environment:
      - HPC_LINK_BASE_URL=http://host.docker.internal:18000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
